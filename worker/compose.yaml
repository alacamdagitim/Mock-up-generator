services:
  psd-worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    env_file: .env
    environment:
      PSD_HOST: 0.0.0.0
      PSD_DATA_DIR: /data
      PSD_PYTHON: /opt/psd/bin/python
    ports:
      - "127.0.0.1:3002:3002"
    volumes:
      - psd-data:/data
    restart: unless-stopped
    mem_limit: 4g
    cpus: 2
    pids_limit: 96
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  psd-data:
