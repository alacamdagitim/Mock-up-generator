<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alaçam · Yerel mockup denemesi</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: #191919;
        background: #f4f4f2;
        font:
          15px/1.5 system-ui,
          sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 20px 28px;
        background: white;
        border-bottom: 1px solid #dededb;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        letter-spacing: -0.4px;
      }
      header p {
        margin: 3px 0 0;
        color: #62625e;
        font-size: 13px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      button,
      .upload {
        border: 1px solid #d1d1cc;
        border-radius: 9px;
        padding: 10px 15px;
        font: inherit;
        background: white;
        color: #191919;
        cursor: pointer;
        white-space: nowrap;
      }
      button.primary {
        background: #191919;
        color: white;
        border-color: #191919;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button:focus-visible,
      .upload:focus-within {
        outline: 3px solid #7250ed;
        outline-offset: 3px;
      }
      .upload input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
      }
      main {
        padding: 24px;
        max-width: 1500px;
        margin: auto;
      }
      .metadata {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        font-size: 13px;
        margin-bottom: 14px;
      }
      #status {
        margin: 0;
      }
      #status[data-error="true"] {
        color: #b72b2b;
      }
      #dimensions {
        color: #62625e;
        white-space: nowrap;
      }
      .scene-info {
        margin: 0 0 16px;
        padding: 14px 16px;
        border: 1px solid #d5d1ba;
        border-radius: 10px;
        background: #faf8eb;
        color: #454332;
        font-size: 13px;
        overflow-wrap: anywhere;
      }
      .scene-info[hidden] {
        display: none;
      }
      .scene-info strong {
        display: block;
        font-size: 14px;
        color: #29281e;
      }
      .scene-info ul {
        margin: 7px 0 0;
        padding-left: 20px;
      }
      .scene-info li + li {
        margin-top: 3px;
      }
      .stage {
        min-height: 300px;
        display: grid;
        place-items: center;
        background: #e5e5e1;
        border-radius: 14px;
        overflow: hidden;
      }
      .stage canvas {
        display: block;
        max-width: 100%;
        max-height: calc(100dvh - 230px);
        width: auto;
        height: auto;
      }
      .note {
        margin: 14px 0 0;
        color: #62625e;
        font-size: 12px;
      }
      @media (max-width: 700px) {
        header {
          display: block;
          padding: 16px;
        }
        .actions {
          margin-top: 15px;
        }
        button,
        .upload {
          padding: 9px 11px;
          font-size: 13px;
        }
        main {
          padding: 14px;
        }
        .stage canvas {
          max-height: calc(100dvh - 300px);
        }
        .metadata {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Fotoğraf sahnesi · Yerel deneme</h1>
        <p>Sabit kamera açısı · Photoshop mockup kalitesi karşılaştırması</p>
      </div>
      <div class="actions">
        <label class="upload"
          >Tasarım seç<input
            id="artwork"
            type="file"
            accept="image/png,image/jpeg,image/webp"
            aria-label="Tasarım görseli seç"
        /></label>
        <button class="primary" id="png" disabled>PNG indir</button>
        <button id="jpeg" disabled>JPG indir</button>
      </div>
    </header>
    <main>
      <div class="metadata">
        <p id="status" role="status" aria-live="polite">Sahne hazırlanıyor…</p>
        <span id="dimensions"></span>
      </div>
      <aside
        class="scene-info"
        id="scene-info"
        aria-label="Sahne bilgisi"
        hidden
      >
        <strong id="scene-heading"></strong>
        <ul id="scene-notes"></ul>
      </aside>
      <div
        class="stage"
        id="stage"
        aria-label="Sabit açılı mockup önizlemesi"
      ></div>
      <p class="note">
        Bu deneme yalnız bu bilgisayarda çalışır. İndirilen dosya birleştirilmiş
        sunum görselidir; üretim veya bıçak izi dosyası değildir.
      </p>
    </main>
    <script type="module">
      import { composeMockup } from "/compositor.mjs";

      const status = document.querySelector("#status");
      const dimensions = document.querySelector("#dimensions");
      const stage = document.querySelector("#stage");
      const png = document.querySelector("#png");
      const jpeg = document.querySelector("#jpeg");
      let config;
      let controller;
      let generation = 0;
      let rendered = null;
      let selectedName = "alacam-mockup";
      const api = (window.privateMockup = {
        ready: false,
        error: "",
        renders: 0,
        width: 0,
        height: 0,
      });

      function showSceneInformation(manifest) {
        const notes = Array.isArray(manifest.notes)
          ? manifest.notes
              .filter((note) => typeof note === "string" && note.trim())
              .slice(0, 12)
          : [];
        const approximate = manifest.approximate === true;
        const information = document.querySelector("#scene-info");
        information.hidden = !approximate && notes.length === 0;
        document.querySelector("#scene-heading").textContent = approximate
          ? "Yaklaşık UV eşlemesi · Kalite denemesi"
          : "Sahne bilgisi";
        document.querySelector("#scene-notes").replaceChildren(
          ...notes.map((note) => {
            const item = document.createElement("li");
            item.textContent = note.slice(0, 800);
            return item;
          }),
        );
        api.approximate = approximate;
        api.notes = notes;
      }

      function setStatus(text, error = false) {
        status.textContent = text;
        status.dataset.error = String(error);
      }

      function release(canvas) {
        if (canvas && canvas !== rendered) canvas.width = canvas.height = 1;
      }

      async function render(artworkUrl, name) {
        controller?.abort();
        controller = new AbortController();
        const signal = controller.signal;
        const request = ++generation;
        api.ready = false;
        api.error = "";
        png.disabled = jpeg.disabled = true;
        setStatus("Tasarım sahneye uygulanıyor…");
        try {
          const artwork = new Image();
          artwork.src = artworkUrl;
          await artwork.decode();
          if (signal.aborted) return;
          const canvas = await composeMockup({
            manifest: config.manifest,
            assetUrl: (path) => "/assets/" + encodeURIComponent(path),
            artwork,
            maxEdge: config.maxEdge || undefined,
            signal,
          });
          if (request !== generation || signal.aborted) {
            release(canvas);
            return;
          }
          if (
            !(canvas instanceof HTMLCanvasElement) ||
            !canvas.width ||
            !canvas.height
          )
            throw new Error("Sahne geçerli bir görsel oluşturamadı.");
          const previous = rendered;
          rendered = canvas;
          canvas.setAttribute("aria-label", "Tasarımınızın fotoğraf sahnesi");
          stage.replaceChildren(canvas);
          release(previous);
          selectedName =
            name
              .replace(/\.[^.]+$/, "")
              .replace(/[^\p{L}\p{N}_-]+/gu, "-")
              .slice(0, 80) || "alacam-mockup";
          api.width = canvas.width;
          api.height = canvas.height;
          api.renders += 1;
          api.ready = true;
          png.disabled = jpeg.disabled = false;
          dimensions.textContent = `${canvas.width} × ${canvas.height} px`;
          setStatus("Hazır · Tasarım, gölge ve yansımalar birleştirildi.");
        } catch (error) {
          if (signal.aborted || request !== generation) return;
          api.error = error instanceof Error ? error.message : String(error);
          setStatus(api.error, true);
        }
      }

      function flatten(format) {
        if (!api.ready || !rendered)
          throw new Error("Mockup görseli henüz hazır değil.");
        if (format === "image/png") return rendered.toDataURL(format);
        const output = document.createElement("canvas");
        output.width = rendered.width;
        output.height = rendered.height;
        try {
          const context = output.getContext("2d");
          if (!context) throw new Error("JPG dosyası oluşturulamıyor.");
          context.fillStyle = "#ffffff";
          context.fillRect(0, 0, output.width, output.height);
          context.drawImage(rendered, 0, 0);
          return output.toDataURL("image/jpeg", 0.96);
        } finally {
          output.width = output.height = 1;
        }
      }

      api.export = flatten;
      api.render = render;
      function download(format) {
        const link = document.createElement("a");
        link.href = flatten(format);
        link.download = `${selectedName}-mockup.${format === "image/png" ? "png" : "jpg"}`;
        link.click();
      }
      png.addEventListener("click", () => download("image/png"));
      jpeg.addEventListener("click", () => download("image/jpeg"));
      document
        .querySelector("#artwork")
        .addEventListener("change", async (event) => {
          const file = event.target.files?.[0];
          if (!file) return;
          if (
            !["image/png", "image/jpeg", "image/webp"].includes(file.type) ||
            file.size > 32 * 1024 * 1024
          ) {
            setStatus(
              "PNG, JPG veya WebP seçin; dosya en fazla 32 MB olabilir.",
              true,
            );
            return;
          }
          const url = URL.createObjectURL(file);
          try {
            await render(url, file.name);
          } finally {
            URL.revokeObjectURL(url);
            event.target.value = "";
          }
        });
      window.addEventListener("pagehide", () => {
        controller?.abort();
        if (rendered) rendered.width = rendered.height = 1;
      });
      try {
        const response = await fetch("/config.json");
        if (!response.ok) throw new Error("Yerel sahne ayarları okunamadı.");
        config = await response.json();
        showSceneInformation(config.manifest);
        await render("/artwork", config.artworkName || "alacam-mockup");
      } catch (error) {
        api.error = error instanceof Error ? error.message : String(error);
        setStatus(api.error, true);
      }
    </script>
  </body>
</html>
