<!doctype html>
<html lang="tr">
  <meta charset="utf-8" />
  <title>Alaçam GLB eşleme kontrolü</title>
  <style>
    body { margin: 0; background: #f2f3f5; font: 16px Arial, sans-serif; color: #171717; }
    h1 { margin: 32px 40px 8px; font-size: 24px; }
    p { margin: 0 40px; }
    canvas { display: block; width: 100%; }
    footer { display: flex; justify-content: space-evenly; padding: 12px; }
  </style>
  <h1>Özgün GLB · yüz eşleme kontrolü</h1>
  <p>140 × 210 mm örnek model — üretim onaysız. Renkli desen yalnız UV kontrolü içindir.</p>
  <canvas id="preview"></canvas>
  <footer><span>Boş model</span><span>Ön yüz</span><span>Arka yüz</span></footer>
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
    import { RoomEnvironment } from "three/examples/jsm/environments/RoomEnvironment.js";
    const canvas = document.querySelector("canvas");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(1200, 560, false);
    renderer.setPixelRatio(1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#f2f3f5");
    const pmrem = new THREE.PMREMGenerator(renderer);
    const room = new RoomEnvironment();
    scene.environment = pmrem.fromScene(room, 0.04).texture;
    scene.environmentIntensity = 0.6;
    room.dispose(); pmrem.dispose();
    const light = new THREE.DirectionalLight(0xffffff, 3);
    light.position.set(-1, 2, 3); scene.add(light);
    const fill = new THREE.HemisphereLight(0xffffff, 0x777777, 2); scene.add(fill);
    const camera = new THREE.PerspectiveCamera(30, 1200 / 560, 0.001, 10);
    camera.position.set(0, 0.04, 0.65); camera.lookAt(0, 0, 0);
    const model = await new GLTFLoader().loadAsync("/product-assets/doypack-v1-r1/model.glb");
    const config = await fetch("/product-assets/doypack-v1-r1/definition.json").then(r => r.json());
    const mapping = {};
    for (const face of ["front", "back"]) {
      const spec = config.faces[face];
      const c = document.createElement("canvas"); c.width = 600; c.height = 900;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "white"; ctx.fillRect(0, 0, 600, 900);
      const {x, y, width, height} = spec.printRectPx;
      ctx.save(); ctx.beginPath(); ctx.rect(x, y, width, height); ctx.clip();
      for (let row = 0; row < 12; row++) for (let column = 0; column < 8; column++) {
        ctx.fillStyle = (row + column) % 2 ? "#daf3ee" : "#278c81";
        ctx.fillRect(column * 80, row * 80, 80, 80);
      }
      ctx.fillStyle = "#ffffff"; ctx.fillRect(60, 280, 480, 210);
      ctx.fillStyle = "#171717"; ctx.textAlign = "center";
      ctx.font = "bold 50px Arial"; ctx.fillText(face === "front" ? "ÖN YÜZ" : "ARKA YÜZ", 300, 365);
      ctx.font = "24px Arial"; ctx.fillText("↑ ÜST · SOL → SAĞ", 300, 415);
      ctx.fillStyle = "#171717"; ctx.fillRect(35, 105, 70, 70);
      ctx.fillStyle = "#efbf32"; ctx.fillRect(495, 765, 70, 70);
      ctx.restore();
      const texture = new THREE.CanvasTexture(c);
      texture.flipY = spec.uv.canvasTextureFlipY;
      texture.colorSpace = THREE.SRGBColorSpace;
      mapping[face] = texture;
    }
    for (let i = 0; i < 3; i++) {
      const instance = model.scene.clone(true);
      instance.position.x = (i - 1) * 0.205;
      instance.rotation.y = i === 2 ? Math.PI - 0.2 : -0.2;
      instance.traverse(node => {
        if (!node.isMesh) return;
        node.material = node.material.clone();
        if (i > 0 && node.userData.printableFace) {
          node.material.map = mapping[node.userData.printableFace];
          node.material.needsUpdate = true;
        }
      });
      scene.add(instance);
    }
    renderer.render(scene, camera);
    document.body.dataset.ready = "true";
  </script>
</html>
