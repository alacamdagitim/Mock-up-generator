<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Shopify Custom Liquid launcher QA</title>
    <style>
      html {
        color: #181818;
        background: #f4efe7;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        overflow: auto;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        padding: 18px 24px;
        background: white;
        border-bottom: 1px solid #ddd;
      }
      header h1 {
        margin: 0 0 12px;
        font-size: 22px;
      }
      .products {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
      }
      form {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      button {
        font:
          32px Georgia,
          serif;
        color: magenta;
        border: 8px dotted magenta;
        background: yellow;
      }
      .store-button {
        font:
          600 14px/1.4 system-ui,
          sans-serif;
        color: white;
        background: #171717;
        border: 0;
        border-radius: 8px;
        padding: 10px 15px;
        cursor: pointer;
      }
      select {
        font:
          14px system-ui,
          sans-serif;
        padding: 8px;
      }
      main {
        min-height: 2500px;
        padding: 32px 24px;
      }
      main p {
        max-width: 680px;
        line-height: 1.6;
      }
      #errors {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 24px;
      }
      @media (max-width: 600px) {
        header {
          padding: 12px;
        }
        header h1 {
          font-size: 18px;
        }
        select {
          max-width: 120px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Alaçam Shopify ürün sayfası · Test</h1>
      <div class="products">
        <form id="product-form-primary" action="/cart/add" method="post">
          <select name="id" aria-label="Mağaza varyantı">
            <option value="10001">Beyaz / 250 g</option>
            <option value="10002" selected>Beyaz / 500 g</option>
          </select>
          <button
            class="store-button"
            type="button"
            data-alacam-open="launcher-config-a"
            data-alacam-product-form="#product-form-primary"
          >
            Design online · Beyaz
          </button>
        </form>
        <form id="product-form-secondary" action="/cart/add" method="post">
          <input name="id" type="hidden" value="20001" />
          <button
            class="store-button"
            type="button"
            data-alacam-open="launcher-config-b"
          >
            Design online · Kraft
          </button>
        </form>
      </div>
    </header>
    <main>
      <h2>Ürün detayı</h2>
      <p>
        Bu izole test sayfası bir Shopify teması gibi davranır. Düğmeye
        basılmadan tasarım editörü ve 3D bağımlılıkları yüklenmez. Sepet veya
        gerçek sipariş oluşturmaz.
      </p>
      <div id="errors">
        <button
          class="store-button"
          type="button"
          data-alacam-open="launcher-config-broken"
        >
          Bozuk ayar testi
        </button>
        <form id="product-form-invalid" action="/cart/add" method="post">
          <input name="id" type="hidden" value="999999" />
          <button
            class="store-button"
            type="button"
            data-alacam-open="launcher-config-a"
            data-alacam-product-form="#product-form-invalid"
          >
            Geçersiz varyant testi
          </button>
        </form>
      </div>
      <div id="dynamic-sections"></div>
    </main>
    <script id="launcher-config-a" type="application/json">
      {
        "apiBase": "/api",
        "productId": "100",
        "productTitle": "Beyaz doypack · QA",
        "productModelUrl": "//cdn.shopify.com/files/urun.glb?v=123",
        "productDielineUrl": "//cdn.shopify.com/files/bicak.pdf?v=456",
        "variants": [
          { "id": 10001, "title": "250 g", "available": true },
          { "id": 10002, "title": "500 g", "available": true }
        ],
        "storageKey": "alacam:test:launcher:a",
        "libraryKey": "alacam:test:launcher:library"
      }
    </script>
    <script id="launcher-config-b" type="application/json">
      {
        "apiBase": "/api",
        "productId": "200",
        "productTitle": "Kraft doypack · QA",
        "variants": [
          { "id": 20001, "title": "Kraft / 250 g", "available": true }
        ],
        "storageKey": "alacam:test:launcher:b",
        "libraryKey": "alacam:test:launcher:library"
      }
    </script>
    <script id="launcher-config-broken" type="application/json">
      { invalid JSON
    </script>
    <script type="module" src="/src/launcher.ts"></script>
  </body>
</html>
