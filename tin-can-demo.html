<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Alaçam · Teneke Kutu Mockup</title>
  </head>
  <body style="margin: 0">
    <div id="tin-can-demo">
      <p role="status" style="padding: 24px; font: 16px sans-serif">
        Mockup yükleniyor…
      </p>
    </div>
    <script type="module">
      import { mountEditor } from "/src/main.tsx";
      import { blankDesign } from "/shared/schema.mjs";
      import { newElement } from "/src/useDesigner.ts";
      async function start() {
        const response = await fetch(
          "/product-assets/mockup-scenes/tin-can-r1/scene.json",
        );
        if (!response.ok) throw Error("Sahne okunamadı.");
        const scene = await response.json();
        const path = (u) => new URL(u).pathname;
        scene.baseImageUrl = path(scene.baseImageUrl);
        scene.plainThumbnailUrl = path(scene.plainThumbnailUrl);
        for (const s of scene.surfaces) {
          s.mapping.url = path(s.mapping.url);
          s.maskUrl = path(s.maskUrl);
        }
        for (const l of scene.layers) l.imageUrl = path(l.imageUrl);
        const storageKey = "alacam:tin-can-demo:v1";
        if (!localStorage.getItem(storageKey)) {
          const d = blankDesign();
          d.name = "Alaçam · Teneke kutu";
          d.artboard = scene.artboard;
          d.background = "#f3eddf";
          for (const [face, name] of [
            ["front", "body"],
            ["back", "lid"],
          ]) {
            const r = await fetch(
              `/product-assets/mockup-scenes/tin-can-r1/artwork-${name}.png`,
            );
            if (!r.ok) throw Error("Örnek tasarım okunamadı.");
            const data = await new Promise((resolve) => {
              const f = new FileReader();
              f.onload = () => resolve(f.result);
              r.blob().then((b) => f.readAsDataURL(b));
            });
            d.faces[face] = [
              {
                ...newElement(
                  "image",
                  face === "front" ? "Alaçam · Gövde" : "Alaçam · Kapak",
                ),
                x: 0,
                y: 0,
                width: 1472,
                height: 1179,
                src: data,
                pixelWidth: face === "front" ? 1472 : 853,
                pixelHeight: face === "front" ? 1179 : 853,
              },
            ];
          }
          localStorage.setItem(storageKey, JSON.stringify(d));
        }
        const host = document.getElementById("tin-can-demo");
        host.replaceChildren();
        mountEditor(host, {
          config: {
            productId: "tin-can-demo",
            productTitle: "Teneke kutu · Elde kapaklı",
            storageKey,
            productMockupScenes: { schemaVersion: 1, scenes: [scene] },
          },
        });
      }
      start().catch(() => {
        document.getElementById("tin-can-demo").textContent =
          "Mockup yüklenemedi. Sayfayı yenileyin.";
      });
    </script>
  </body>
</html>
